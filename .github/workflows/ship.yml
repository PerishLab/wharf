name: ship
run-name: "[ship] ${{ inputs.repository }} ${{ inputs.marker }}"

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Product repository, owner/name
        required: true
        type: string
      marker:
        description: Release marker tag in the product repository
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ship-${{ inputs.repository }}-${{ inputs.marker }}
  cancel-in-progress: false

env:
  WHARF_R2_ENDPOINT: ${{ vars.WHARF_R2_ENDPOINT }}
  WHARF_R2_BUCKET: ${{ vars.WHARF_R2_BUCKET }}

defaults:
  run:
    working-directory: wharf

jobs:
  plan:
    name: "[plan] entries"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      layer-1: ${{ steps.plan.outputs.layer-1 }}
      layer-2: ${{ steps.plan.outputs.layer-2 }}
      layer-3: ${{ steps.plan.outputs.layer-3 }}
      layer-4: ${{ steps.plan.outputs.layer-4 }}
      node: ${{ steps.engines.outputs.node }}
      pnpm: ${{ steps.engines.outputs.pnpm }}
      domain: ${{ steps.engines.outputs.domain }}
      cfworker: ${{ steps.plan.outputs.cfworker }}
      npm: ${{ steps.npm.outputs.decision }}
      oci: ${{ steps.oci.outputs.decision }}
      chart: ${{ steps.chart.outputs.decision }}
      release: ${{ steps.release.outputs.decision }}
      channel: ${{ steps.channel.outputs.decision }}
      cargo: ${{ steps.cargo.outputs.decision }}
      planned: ${{ steps.plan.outputs.planned }}
      presence: ${{ steps.plan.outputs.presence }}
      snapshot: ${{ steps.plan.outputs.snapshot }}
      commit: ${{ steps.source.outputs.commit }}
      tree: ${{ steps.source.outputs.tree }}
    steps:
      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[verify] request"
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.plan check

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[identify] source"
        id: source
        env:
          WHARF_SOURCE: ../product
        run: python3 -B -m scripts.plan source

      - name: "[login] registry"
        working-directory: .
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: "[prepare] machine controls"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: snapshot

      - name: "[read] engines"
        id: engines
        env:
          WHARF_SOURCE: ../product
        run: python3 -B -m scripts.media engines

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: rust node pnpm
          node: ${{ steps.engines.outputs.node }}
          pnpm: ${{ steps.engines.outputs.pnpm }}
          rust: ${{ fromJSON(steps.engines.outputs.domain)['rust.version'] }}

      - name: "[decide] npm"
        id: npm
        env:
          WHARF_SOURCE: ../product
          WHARF_MARKER: ${{ inputs.marker }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B -m scripts.media npm-plan

      - name: "[decide] oci"
        id: oci
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.media oci-plan

      - name: "[decide] chart"
        id: chart
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.media chart-plan

      - name: "[decide] binaries"
        id: release
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_COMMIT: ${{ steps.source.outputs.commit }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_SOURCE: ../product
        run: python3 -B -m scripts.media release-plan

      - name: "[decide] channel"
        id: channel
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_SOURCE: ../product
        run: python3 -B -m scripts.channel plan

      - name: "[decide] cargo"
        id: cargo
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_COMMIT: ${{ steps.source.outputs.commit }}
          WHARF_TREE: ${{ steps.source.outputs.tree }}
        run: python3 -B -m scripts.media cargo-plan

      - name: "[record] plan"
        id: plan
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_COMMIT: ${{ steps.source.outputs.commit }}
          WHARF_TREE: ${{ steps.source.outputs.tree }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_STEPS: ${{ toJSON(steps) }}
          WHARF_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHARF_DOMAIN: ${{ steps.engines.outputs.domain }}
          WHARF_R2_ENDPOINT: ${{ vars.WHARF_R2_ENDPOINT }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.plan record

  layer-1:
    needs: [plan]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.layer-1 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.layer-1) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: "[prepare] autocrlf"
        if: contains(matrix.prepare, 'autocrlf')
        working-directory: .
        run: git config --global core.autocrlf false

      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: ${{ join(matrix.prepare, ' ') }}
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}
          rust: ${{ fromJSON(needs.plan.outputs.domain)['rust.version'] }}

      - name: ${{ matrix.name }}
        env:
          WHARF_UNIT: ${{ matrix.action }}
          WHARF_TARGET: ${{ matrix.target }}
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          WHARF_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHARF_DOMAIN: ${{ needs.plan.outputs.domain }}
        run: python3 -B -m scripts.ship step

  layer-2:
    needs: [plan, layer-1]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.layer-2 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.layer-2) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: "[prepare] autocrlf"
        if: contains(matrix.prepare, 'autocrlf')
        working-directory: .
        run: git config --global core.autocrlf false

      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: ${{ join(matrix.prepare, ' ') }}
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}
          rust: ${{ fromJSON(needs.plan.outputs.domain)['rust.version'] }}

      - name: ${{ matrix.name }}
        env:
          WHARF_UNIT: ${{ matrix.action }}
          WHARF_TARGET: ${{ matrix.target }}
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          WHARF_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHARF_DOMAIN: ${{ needs.plan.outputs.domain }}
        run: python3 -B -m scripts.ship step

  layer-3:
    needs: [plan, layer-1, layer-2]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.layer-3 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.layer-3) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: "[prepare] autocrlf"
        if: contains(matrix.prepare, 'autocrlf')
        working-directory: .
        run: git config --global core.autocrlf false

      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: ${{ join(matrix.prepare, ' ') }}
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}
          rust: ${{ fromJSON(needs.plan.outputs.domain)['rust.version'] }}

      - name: ${{ matrix.name }}
        env:
          WHARF_UNIT: ${{ matrix.action }}
          WHARF_TARGET: ${{ matrix.target }}
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          WHARF_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHARF_DOMAIN: ${{ needs.plan.outputs.domain }}
        run: python3 -B -m scripts.ship step

  layer-4:
    needs: [plan, layer-1, layer-2, layer-3]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.layer-4 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.layer-4) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: "[prepare] autocrlf"
        if: contains(matrix.prepare, 'autocrlf')
        working-directory: .
        run: git config --global core.autocrlf false

      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: ${{ join(matrix.prepare, ' ') }}
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}
          rust: ${{ fromJSON(needs.plan.outputs.domain)['rust.version'] }}

      - name: ${{ matrix.name }}
        env:
          WHARF_UNIT: ${{ matrix.action }}
          WHARF_TARGET: ${{ matrix.target }}
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          WHARF_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHARF_DOMAIN: ${{ needs.plan.outputs.domain }}
        run: python3 -B -m scripts.ship step

  npm:
    name: "[publish] npm"
    needs: [plan, layer-1, layer-2, layer-3, layer-4]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.npm == 'run' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      snapshot: ${{ steps.published.outputs.snapshot }}
    steps:
      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: snapshot rust node pnpm
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}
          rust: ${{ fromJSON(needs.plan.outputs.domain)['rust.version'] }}

      - name: "[publish] npm"
        id: published
        env:
          WHARF_PACKAGES_TOKEN: ${{ secrets.PERISHLAB_PACKAGES_READ }}
          WHARF_DOMAIN: ${{ needs.plan.outputs.domain }}
          WHARF_SOURCE: ../product
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B -m scripts.media npm-publish
  oci:
    name: "[publish] oci"
    needs: [plan, layer-1, layer-2, layer-3, layer-4]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.oci == 'run' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      snapshot: ${{ steps.published.outputs.snapshot }}
    steps:
      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[login] registry"
        working-directory: .
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: snapshot rust node pnpm
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}
          rust: ${{ fromJSON(needs.plan.outputs.domain)['rust.version'] }}

      - name: "[publish] oci"
        id: published
        env:
          WHARF_PACKAGES_TOKEN: ${{ secrets.PERISHLAB_PACKAGES_READ }}
          WHARF_DOMAIN: ${{ needs.plan.outputs.domain }}
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.media oci-publish
  chart:
    name: "[publish] chart"
    needs: [plan, layer-1, layer-2, layer-3, layer-4]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.chart == 'run' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      snapshot: ${{ steps.published.outputs.snapshot }}
    steps:
      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[login] registry"
        working-directory: .
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: snapshot rust node pnpm
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}
          rust: ${{ fromJSON(needs.plan.outputs.domain)['rust.version'] }}

      - name: "[publish] chart"
        id: published
        env:
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_PACKAGES_TOKEN: ${{ secrets.PERISHLAB_PACKAGES_READ }}
          WHARF_DOMAIN: ${{ needs.plan.outputs.domain }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.media chart-publish
  release:
    name: "[publish] binaries"
    needs: [plan, layer-1, layer-2, layer-3, layer-4]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.release == 'run' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    outputs:
      snapshot: ${{ steps.published.outputs.snapshot }}
    steps:
      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: snapshot rust node pnpm
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}
          rust: ${{ fromJSON(needs.plan.outputs.domain)['rust.version'] }}

      - name: "[publish] binaries"
        id: published
        env:
          WHARF_PACKAGES_TOKEN: ${{ secrets.PERISHLAB_PACKAGES_READ }}
          WHARF_DOMAIN: ${{ needs.plan.outputs.domain }}
          WHARF_SOURCE: ../product
          WHARF_RELEASES_ACCESS_KEY_ID: ${{ secrets.WHARF_RELEASES_ACCESS_KEY_ID }}
          WHARF_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.WHARF_RELEASES_SECRET_ACCESS_KEY }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship release
  channel:
    name: "[point] channel"
    needs: [plan, layer-1, layer-2, layer-3, layer-4, npm, oci, chart, cargo, cfworker, release]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.channel == 'run' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    steps:
      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[point] channel"
        env:
          WHARF_SOURCE: ../product
          WHARF_RELEASES_ACCESS_KEY_ID: ${{ secrets.WHARF_RELEASES_ACCESS_KEY_ID }}
          WHARF_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.WHARF_RELEASES_SECRET_ACCESS_KEY }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
        run: python3 -B -m scripts.channel point

  cfworker:
    name: "[deploy] cfworker"
    needs: [plan, layer-1, layer-2, layer-3, layer-4]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.cfworker == 'run' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      snapshot: ${{ steps.published.outputs.snapshot }}
    steps:
      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: snapshot rust node pnpm
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}
          rust: ${{ fromJSON(needs.plan.outputs.domain)['rust.version'] }}

      - name: "[deploy] cfworker"
        id: published
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WHARF_CLOUDFLARE_TOKEN }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          WHARF_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHARF_DOMAIN: ${{ needs.plan.outputs.domain }}
        run: python3 -B -m scripts.ship cfworker-deploy
  cargo:
    name: "[publish] cargo"
    needs: [plan, layer-1, layer-2, layer-3, layer-4]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.cargo == 'run' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    outputs:
      snapshot: ${{ steps.published.outputs.snapshot }}
    steps:
      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: snapshot rust node pnpm
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}
          rust: ${{ fromJSON(needs.plan.outputs.domain)['rust.version'] }}

      - name: "[publish] cargo"
        id: published
        env:
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_PACKAGES_TOKEN: ${{ secrets.PERISHLAB_PACKAGES_READ }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_COMMIT: ${{ needs.plan.outputs.commit }}
          WHARF_TREE: ${{ needs.plan.outputs.tree }}
          WHARF_CARGO_ACCESS_KEY_ID: ${{ secrets.WHARF_CARGO_ACCESS_KEY_ID }}
          WHARF_CARGO_SECRET_ACCESS_KEY: ${{ secrets.WHARF_CARGO_SECRET_ACCESS_KEY }}
          WHARF_DOMAIN: ${{ needs.plan.outputs.domain }}
        run: python3 -B -m scripts.media cargo-publish
  distribution:
    name: "[record] distribution"
    needs: [plan, layer-1, layer-2, layer-3, layer-4, npm, oci, chart, release, channel, cfworker, cargo]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[record] distribution"
        env:
          WHARF_NEEDS: ${{ toJSON(needs) }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_COMMIT: ${{ needs.plan.outputs.commit }}
          WHARF_TREE: ${{ needs.plan.outputs.tree }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_RELEASES_ACCESS_KEY_ID: ${{ secrets.WHARF_RELEASES_ACCESS_KEY_ID }}
          WHARF_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.WHARF_RELEASES_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.distribution record
