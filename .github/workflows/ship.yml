name: ship
run-name: "${{ inputs.prepare && '[prepare]' || inputs.candidate && '[candidate]' || (inputs.run != '' && (inputs.reference != '' && '[compare]' || inputs.proof && '[prove]' || '[windtun]') || '[ship]') }} ${{ inputs.repository }} ${{ inputs.marker }}"

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Product repository, owner/name
        required: true
        type: string
      marker:
        description: Release marker tag in the product repository
        required: true
        type: string
      run:
        description: Replay a publication or select the run holding a candidate plan
        required: false
        type: string
      proof:
        description: Revalidate published binary association without running Windtun
        required: false
        type: boolean
        default: false
      case:
        description: Declared suite or one explicit diagnostic case
        required: false
        type: string
        default: declared
      reference:
        description: Non-stable marker to compare with this stable Linux installation archive
        required: false
        type: string
      candidate:
        description: Inspect an exact recorded stable plan without publishing or reading its release records
        required: false
        type: boolean
        default: false
      prepare:
        description: Build and inspect an annotated stable intent without product publication
        required: false
        type: boolean
        default: false
      attempt:
        description: Exact plan attempt for candidate inspection
        required: false
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: ship-${{ inputs.repository }}-${{ !inputs.prepare && !inputs.candidate && inputs.run == '' && !contains(inputs.marker, '-') && 'stable' || inputs.marker }}
  queue: max
  cancel-in-progress: false

env:
  WHARF_R2_ENDPOINT: ${{ vars.WHARF_R2_ENDPOINT }}
  WHARF_R2_BUCKET: ${{ vars.WHARF_R2_BUCKET }}

defaults:
  run:
    working-directory: wharf

jobs:
  request:
    name: "[verify] request"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      preparation: ${{ steps.request.outputs.preparation }}
    steps:
      - name: "[checkout] trusted wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: wharf
          persist-credentials: false

      - name: "[prepare] qualification reader"
        if: inputs.prepare
        working-directory: .
        run: |
          curl -fsSL https://releases.plumb.perish.uk/manage.sh -o "$RUNNER_TEMP/manage-plumb.sh"
          env PLUMB_CHANNEL=stable PLUMB_VERSION= sh "$RUNNER_TEMP/manage-plumb.sh" install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "[verify] request"
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          WHARF_OBSERVER: '{"run":"${{ github.run_id }}","attempt":"${{ github.run_attempt }}","wharf":"${{ github.sha }}"}'
          WHARF_SELECTION: '{"schema":"wharf.ship.request/v1","inputs":${{ toJSON(inputs) }}}'
        run: python3 -B -m scripts.distribution request

  plan:
    needs: [request]
    if: needs.request.result == 'success' && inputs.run == '' && !inputs.candidate
    name: "[plan] entries"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      layer-1: ${{ steps.plan.outputs.layer-1 }}
      layer-2: ${{ steps.plan.outputs.layer-2 }}
      layer-3: ${{ steps.plan.outputs.layer-3 }}
      layer-4: ${{ steps.plan.outputs.layer-4 }}
      node: ${{ steps.engines.outputs.node }}
      pnpm: ${{ steps.engines.outputs.pnpm }}
      domain: ${{ steps.engines.outputs.domain }}
      cfworker: ${{ steps.plan.outputs.cfworker }}
      npm: ${{ steps.npm.outputs.decision }}
      oci: ${{ steps.oci.outputs.decision }}
      chart: ${{ steps.chart.outputs.decision }}
      release: ${{ steps.release.outputs.decision }}
      channel: ${{ steps.channel.outputs.decision }}
      cargo: ${{ steps.cargo.outputs.decision }}
      planned: ${{ steps.plan.outputs.planned }}
      plan-reference: ${{ steps.plan.outputs.plan-reference }}
      presence: ${{ steps.plan.outputs.presence }}
      snapshot: ${{ steps.plan.outputs.snapshot }}
      trial: ${{ steps.plan.outputs.trial }}
      publisher: ${{ steps.plan.outputs.publisher }}
      windtun: ${{ steps.plan.outputs.windtun }}
      binaryproof: ${{ steps.plan.outputs.binaryproof }}
      commit: ${{ steps.source.outputs.commit }}
      tree: ${{ steps.source.outputs.tree }}
    steps:
      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[verify] request"
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.plan check

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[identify] source"
        id: source
        env:
          WHARF_SOURCE: ../product
        run: python3 -B -m scripts.plan source

      - name: "[identify] product"
        id: named
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
        run: python3 -B -m scripts.plan named

      - name: "[prepare] installation"
        id: reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}
          owner: ${{ steps.named.outputs.owner }}
          repositories: ${{ steps.named.outputs.name }}
          permission-actions: read
          permission-contents: read

      - name: "[login] registry"
        if: ${{ !inputs.prepare }}
        working-directory: .
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: "[prepare] machine controls"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: snapshot

      - name: "[read] engines"
        id: engines
        env:
          WHARF_SOURCE: ../product
        run: python3 -B -m scripts.media engines

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: rust node pnpm
          node: ${{ steps.engines.outputs.node }}
          pnpm: ${{ steps.engines.outputs.pnpm }}
          rust: ${{ fromJSON(steps.engines.outputs.domain)['rust.version'] }}

      - name: "[decide] npm"
        if: ${{ !inputs.prepare }}
        id: npm
        env:
          WHARF_SOURCE: ../product
          WHARF_MARKER: ${{ inputs.marker }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B -m scripts.media npm-plan

      - name: "[decide] oci"
        if: ${{ !inputs.prepare }}
        id: oci
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.media oci-plan

      - name: "[decide] chart"
        if: ${{ !inputs.prepare }}
        id: chart
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.media chart-plan

      - name: "[decide] binaries"
        if: ${{ !inputs.prepare }}
        id: release
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_COMMIT: ${{ steps.source.outputs.commit }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_SOURCE: ../product
        run: python3 -B -m scripts.media release-plan

      - name: "[decide] channel"
        if: ${{ !inputs.prepare }}
        id: channel
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_SOURCE: ../product
        run: python3 -B -m scripts.channel plan

      - name: "[decide] cargo"
        if: ${{ !inputs.prepare }}
        id: cargo
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_COMMIT: ${{ steps.source.outputs.commit }}
          WHARF_TREE: ${{ steps.source.outputs.tree }}
        run: python3 -B -m scripts.media cargo-plan

      - name: "[prepare] qualification reader"
        if: inputs.prepare
        working-directory: .
        run: |
          curl -fsSL https://releases.plumb.perish.uk/manage.sh -o "$RUNNER_TEMP/manage-plumb.sh"
          env PLUMB_CHANNEL=stable PLUMB_VERSION= sh "$RUNNER_TEMP/manage-plumb.sh" install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "[record] plan"
        id: plan
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_COMMIT: ${{ steps.source.outputs.commit }}
          WHARF_TREE: ${{ steps.source.outputs.tree }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          WHARF_PREPARING: ${{ inputs.prepare }}
          WHARF_PREPARATION: ${{ needs.request.outputs.preparation }}
          WHARF_STEPS: ${{ toJSON(steps) }}
          WHARF_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHARF_GUARD_TOKEN: ${{ steps.reader.outputs.token }}
          WHARF_DOMAIN: ${{ steps.engines.outputs.domain }}
          WHARF_R2_ENDPOINT: ${{ vars.WHARF_R2_ENDPOINT }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.plan record

  layer-1:
    needs: [plan]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.layer-1 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.layer-1) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: "[prepare] autocrlf"
        if: contains(matrix.prepare, 'autocrlf')
        working-directory: .
        run: git config --global core.autocrlf false

      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: ${{ join(matrix.prepare, ' ') }}
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}
          rust: ${{ fromJSON(needs.plan.outputs.domain)['rust.version'] }}

      - name: ${{ matrix.name }}
        env:
          WHARF_UNIT: ${{ matrix.action }}
          WHARF_TARGET: ${{ matrix.target }}
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          WHARF_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHARF_DOMAIN: ${{ needs.plan.outputs.domain }}
        run: python3 -B -m scripts.ship step

  layer-2:
    needs: [plan, layer-1]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.layer-2 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.layer-2) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: "[prepare] autocrlf"
        if: contains(matrix.prepare, 'autocrlf')
        working-directory: .
        run: git config --global core.autocrlf false

      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: ${{ join(matrix.prepare, ' ') }}
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}
          rust: ${{ fromJSON(needs.plan.outputs.domain)['rust.version'] }}

      - name: ${{ matrix.name }}
        env:
          WHARF_UNIT: ${{ matrix.action }}
          WHARF_TARGET: ${{ matrix.target }}
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          WHARF_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHARF_DOMAIN: ${{ needs.plan.outputs.domain }}
        run: python3 -B -m scripts.ship step

  layer-3:
    needs: [plan, layer-1, layer-2]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.layer-3 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.layer-3) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: "[prepare] autocrlf"
        if: contains(matrix.prepare, 'autocrlf')
        working-directory: .
        run: git config --global core.autocrlf false

      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: ${{ join(matrix.prepare, ' ') }}
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}
          rust: ${{ fromJSON(needs.plan.outputs.domain)['rust.version'] }}

      - name: ${{ matrix.name }}
        env:
          WHARF_UNIT: ${{ matrix.action }}
          WHARF_TARGET: ${{ matrix.target }}
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          WHARF_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHARF_DOMAIN: ${{ needs.plan.outputs.domain }}
        run: python3 -B -m scripts.ship step

  layer-4:
    needs: [plan, layer-1, layer-2, layer-3]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.layer-4 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.layer-4) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: "[prepare] autocrlf"
        if: contains(matrix.prepare, 'autocrlf')
        working-directory: .
        run: git config --global core.autocrlf false

      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: ${{ join(matrix.prepare, ' ') }}
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}
          rust: ${{ fromJSON(needs.plan.outputs.domain)['rust.version'] }}

      - name: ${{ matrix.name }}
        env:
          WHARF_UNIT: ${{ matrix.action }}
          WHARF_TARGET: ${{ matrix.target }}
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          WHARF_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHARF_DOMAIN: ${{ needs.plan.outputs.domain }}
        run: python3 -B -m scripts.ship step

  promotion-prepare:
    name: "[windtun] prepare promotion"
    needs: [plan, layer-1, layer-2, layer-3, layer-4]
    if: always() && !cancelled() && needs.plan.result == 'success' && inputs.repository == 'PerishLab/plumb' && !contains(inputs.marker, '-') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !inputs.prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: "[checkout] trusted wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: wharf
          persist-credentials: false

      - name: "[prepare] qualification reader"
        working-directory: .
        run: |
          curl -fsSL https://releases.plumb.perish.uk/manage.sh -o "$RUNNER_TEMP/manage-plumb.sh"
          env PLUMB_CHANNEL=stable PLUMB_VERSION= sh "$RUNNER_TEMP/manage-plumb.sh" install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "[windtun] prepare promotion"
        id: prepared
        env:
          GH_TOKEN: ${{ github.token }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_OBSERVER: '{"run":"${{ github.run_id }}","attempt":"${{ github.run_attempt }}","wharf":"${{ github.sha }}"}'
          WHARF_SOURCE: ${{ runner.temp }}/promotion-preparation
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.distribution promotion-prepare

      - name: "[windtun] read promotion preparation"
        if: always() && steps.prepared.outputs.digest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_OBSERVER: '{"run":"${{ github.run_id }}","attempt":"${{ github.run_attempt }}","wharf":"${{ github.sha }}"}'
          WHARF_SOURCE: ${{ runner.temp }}/promotion-preparation
          WHARF_DIGEST: ${{ steps.prepared.outputs.digest }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.distribution promotion-read

      - name: "[preserve] promotion preparation"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: promotion-preparation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-preparation
          if-no-files-found: warn
          retention-days: 14

  npm:
    name: "[publish] npm"
    needs: [plan, layer-1, layer-2, layer-3, layer-4, promotion-prepare]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.npm == 'run' && !contains(format('{0} {1} {2} {3}', needs.layer-1.result, needs.layer-2.result, needs.layer-3.result, needs.layer-4.result), 'failure') && !contains(format('{0} {1} {2} {3}', needs.layer-1.result, needs.layer-2.result, needs.layer-3.result, needs.layer-4.result), 'cancelled') && !inputs.prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      snapshot: ${{ steps.published.outputs.snapshot }}
    steps:
      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: snapshot rust node pnpm
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}
          rust: ${{ fromJSON(needs.plan.outputs.domain)['rust.version'] }}

      - name: "[publish] npm"
        id: published
        env:
          WHARF_PACKAGES_TOKEN: ${{ secrets.PERISHLAB_PACKAGES_READ }}
          WHARF_DOMAIN: ${{ needs.plan.outputs.domain }}
