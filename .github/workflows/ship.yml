          GH_TOKEN: ${{ github.token }}
          WHARF_OBSERVER: '{"run":"${{ github.run_id }}","attempt":"${{ github.run_attempt }}","wharf":"${{ github.sha }}"}'
          WHARF_DIGEST: ${{ steps.candidate.outputs.digest }}
          WHARF_SOURCE: ${{ runner.temp }}/binary-candidate
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.distribution build-candidate-read

      - name: "[preserve] candidate binary"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binary-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/binary-candidate
          if-no-files-found: error
          retention-days: 14

  native-proof:
    name: "[prove] native binary"
    needs: [request, plan, distribution]
    if: ${{ needs.request.result == 'success' && !inputs.prepare && !cancelled() && !inputs.candidate && ((inputs.run != '' && (inputs.proof || inputs.reference != '')) || (inputs.run == '' && needs.distribution.outputs.state == 'complete' && needs.plan.outputs.binaryproof == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: "[checkout] trusted wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: wharf
          persist-credentials: false

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: rcodesign

      - name: "[prove] native binary"
        id: proved
        env:
          GH_TOKEN: ${{ github.token }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_OBSERVATION: ${{ runner.temp }}/native-observation
          WHARF_RUN: ${{ inputs.run || 'null' }}
          WHARF_OBSERVER: '{"run":"${{ github.run_id }}","attempt":"${{ github.run_attempt }}","wharf":"${{ github.sha }}"}'
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          WHARF_RELEASES_ACCESS_KEY_ID: ${{ secrets.WHARF_RELEASES_ACCESS_KEY_ID }}
          WHARF_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.WHARF_RELEASES_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.distribution native-proof

      - name: "[read] native binary"
        if: steps.proved.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_OBSERVATION: ${{ runner.temp }}/native-observation
        run: python3 -B -m scripts.distribution native-read

      - name: "[compare] native binary"
        if: inputs.reference != '' && steps.proved.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_OBSERVATION: ${{ runner.temp }}/native-observation
          WHARF_REFERENCE: ${{ inputs.reference }}
          WHARF_SOURCE: ${{ runner.temp }}/native-comparison
        run: python3 -B -m scripts.distribution native-compare

      - name: "[preserve] native comparison"
        if: always() && inputs.reference != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-comparison-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-comparison
          if-no-files-found: ignore
          retention-days: 14

      - name: "[preserve] native observation"
        if: always() && steps.proved.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-observation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-observation
          if-no-files-found: error
          retention-days: 14

  native-candidate:
    name: "[prove] native candidate binary"
    needs: [request, plan, prepared, build-candidate]
    if: always() && !cancelled() && needs.request.result == 'success' && (inputs.candidate || (inputs.prepare && needs.prepared.result == 'success')) && needs.build-candidate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: "[checkout] trusted wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: wharf
          persist-credentials: false

      - name: "[prepare] machine"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: rcodesign

      - name: "[prove] native candidate binary"
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_RUN: ${{ inputs.prepare && github.run_id || inputs.run }}
          WHARF_ATTEMPT: ${{ inputs.prepare && needs.plan.outputs.planned || inputs.attempt }}
          WHARF_REFERENCE: ${{ inputs.reference }}
          WHARF_OBSERVER: '{"run":"${{ github.run_id }}","attempt":"${{ github.run_attempt }}","wharf":"${{ github.sha }}"}'
          WHARF_SOURCE: ${{ runner.temp }}/native-candidate
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.distribution native-candidate

      - name: "[read] native candidate binary"
        if: always() && steps.candidate.outputs.digest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WHARF_OBSERVER: '{"run":"${{ github.run_id }}","attempt":"${{ github.run_attempt }}","wharf":"${{ github.sha }}"}'
          WHARF_DIGEST: ${{ steps.candidate.outputs.digest }}
          WHARF_SOURCE: ${{ runner.temp }}/native-candidate
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.distribution native-candidate-read

      - name: "[preserve] native candidate binary"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-candidate
          if-no-files-found: error
          retention-days: 14

  windtun-prepare:
    name: "[windtun] prepare attempt"
    needs: [request, plan, distribution]
    permissions:
      contents: read
      actions: read
    if: needs.request.result == 'success' && !inputs.prepare && !inputs.proof && always() && !inputs.candidate && (inputs.run == '' || inputs.reference == '') && (inputs.run != '' || (needs.distribution.outputs.state == 'complete' && needs.plan.outputs.windtun == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.prepared.outputs.ready }}
    env:
      WHARF_OBSERVER: '{"run":"${{ github.run_id }}","attempt":"${{ github.run_attempt }}","wharf":"${{ github.sha }}"}'
    steps:
      - name: "[checkout] trusted wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: wharf
          persist-credentials: false

      - name: "[windtun] admit publisher"
        id: admit
        env:
          WHARF_SOURCE: ${{ runner.temp }}/seatrial-observation
          GH_TOKEN: ${{ github.token }}
          WHARF_PUBLISHER: ${{ needs.plan.outputs.publisher || 'null' }}
          WHARF_SELECTION: '{"repository":${{ toJSON(inputs.repository) }},"marker":${{ toJSON(inputs.marker) }}}'
          WHARF_RUN: ${{ inputs.run || github.run_id }}
        run: python3 -B -m scripts.distribution trial-admit

      - name: "[windtun] prepare attempt"
        id: prepared
        if: steps.admit.outputs.eligible == 'true'
        env:
          WHARF_SOURCE: ${{ runner.temp }}/seatrial-observation
          GH_TOKEN: ${{ github.token }}
          WHARF_TRIALCASE: ${{ inputs.case || 'declared' }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          WHARF_RELEASES_ACCESS_KEY_ID: ${{ secrets.WHARF_RELEASES_ACCESS_KEY_ID }}
          WHARF_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.WHARF_RELEASES_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.distribution windtun-prepare

  windtun:
    name: "[windtun] published artifacts"
    needs: [windtun-prepare]
    permissions:
      contents: read
      actions: read
    if: ${{ !cancelled() && needs.windtun-prepare.result == 'success' && needs.windtun-prepare.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.recorded.outputs.digest }}
    env:
      WHARF_REPOSITORY: ${{ inputs.repository }}
      WHARF_MARKER: ${{ inputs.marker }}
      WHARF_OBSERVER: '{"run":"${{ github.run_id }}","attempt":"${{ github.run_attempt }}","wharf":"${{ github.sha }}"}'
    steps:
      - name: "[checkout] trusted wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: wharf
          persist-credentials: false

      - name: "[windtun] load attempt"
        id: loaded
        env:
          WHARF_SOURCE: ${{ runner.temp }}/seatrial-observation
          GH_TOKEN: ${{ github.token }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.distribution windtun-load

      - name: "[windtun] published artifacts"
        if: steps.loaded.outputs.ready == 'true'
        env:
          WHARF_SOURCE: ${{ runner.temp }}/seatrial-observation
          WHARF_TRIALCASE: ${{ inputs.case || 'declared' }}
        run: python3 -B -m scripts.distribution trial-run

      - name: "[windtun] judge observation"
        if: always() && steps.loaded.outputs.ready == 'true'
        env:
          WHARF_SOURCE: ${{ runner.temp }}/seatrial-observation
        run: python3 -B -m scripts.distribution trial-judge

      - name: "[windtun] record attempt"
        id: recorded
        if: always() && steps.loaded.outputs.ready == 'true'
        env:
          WHARF_SOURCE: ${{ runner.temp }}/seatrial-observation
          GH_TOKEN: ${{ github.token }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.distribution windtun-store

      - name: "[windtun] preserve evidence"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: seatrial-observation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seatrial-observation/evidence
          if-no-files-found: error
          retention-days: 14

  windtun-issue:
    name: "[windtun] issue qualification"
    needs: [request, windtun-prepare, windtun]
    permissions:
      contents: read
      actions: read
    if: always() && needs.request.result == 'success' && needs.windtun-prepare.outputs.ready == 'true' && !inputs.prepare && !inputs.proof
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "[checkout] trusted wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: wharf
          persist-credentials: false

      - name: "[windtun] issue qualification"
        env:
          GH_TOKEN: ${{ github.token }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_OBSERVER: '{"run":"${{ github.run_id }}","attempt":"${{ github.run_attempt }}","wharf":"${{ github.sha }}"}'
          WHARF_DIGEST: ${{ needs.windtun.outputs.digest || 'null' }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          WHARF_RELEASES_ACCESS_KEY_ID: ${{ secrets.WHARF_RELEASES_ACCESS_KEY_ID }}
          WHARF_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.WHARF_RELEASES_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.distribution windtun-issue
