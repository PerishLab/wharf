name: ship

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Product repository, owner/name
        required: true
        type: string
      marker:
        description: Release marker tag in the product repository
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ship-${{ inputs.repository }}-${{ inputs.marker }}
  cancel-in-progress: false

env:
  WHARF_R2_ENDPOINT: ${{ vars.WHARF_R2_ENDPOINT }}
  WHARF_R2_BUCKET: ${{ vars.WHARF_R2_BUCKET }}

defaults:
  run:
    working-directory: wharf

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      layer-1: ${{ steps.plan.outputs.layer-1 }}
      layer-2: ${{ steps.plan.outputs.layer-2 }}
      layer-3: ${{ steps.plan.outputs.layer-3 }}
      node: ${{ steps.engines.outputs.node }}
      pnpm: ${{ steps.engines.outputs.pnpm }}
      cfworker: ${{ steps.plan.outputs.cfworker }}
      npm: ${{ steps.npm.outputs.decision }}
      oci: ${{ steps.oci.outputs.decision }}
      chart: ${{ steps.chart.outputs.decision }}
      release: ${{ steps.release.outputs.decision }}
      cargo: ${{ steps.cargo.outputs.decision }}
      planned: ${{ steps.plan.outputs.planned }}
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Refuse a malformed request
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.plan check

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Identify source
        id: source
        env:
          WHARF_SOURCE: ../product
        run: python3 -B -m scripts.plan source

      - name: Sign in to the package registry
        working-directory: .
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: engines
        id: engines
        env:
          WHARF_SOURCE: ../product
        run: python3 -B -m scripts.ship node-engines

      - name: npm packages
        id: npm
        env:
          WHARF_SOURCE: ../product
          WHARF_MARKER: ${{ inputs.marker }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B -m scripts.ship npm-plan

      - name: oci image
        id: oci
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.ship oci-plan

      - name: charts
        id: chart
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.ship chart-plan

      - name: binary release
        id: release
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_COMMIT: ${{ steps.source.outputs.commit }}
          WHARF_WHARF: ${{ github.sha }}
        run: python3 -B -m scripts.ship release-plan

      - name: cargo packages
        id: cargo
        env:
          WHARF_SOURCE: ../product
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_CARGO_TOKEN: ${{ secrets.WHARF_CARGO_TOKEN }}
        run: python3 -B -m scripts.ship cargo-plan

      - name: Record the plan this run decided
        id: plan
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_COMMIT: ${{ steps.source.outputs.commit }}
          WHARF_TREE: ${{ steps.source.outputs.tree }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_STEPS: ${{ toJSON(steps) }}
          WHARF_R2_ENDPOINT: ${{ vars.WHARF_R2_ENDPOINT }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.plan record

  layer-1:
    needs: [plan]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.layer-1 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.layer-1) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: Keep checkouts byte-identical
        if: contains(matrix.prepare, 'autocrlf')
        working-directory: .
        run: git config --global core.autocrlf false

      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Prepare the machine
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: ${{ join(matrix.prepare, ' ') }}
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}

      - name: Run and record the unit
        env:
          WHARF_UNIT: ${{ matrix.action }}
          WHARF_TARGET: ${{ matrix.target }}
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship step

  layer-2:
    needs: [plan, layer-1]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.layer-2 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.layer-2) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: Keep checkouts byte-identical
        if: contains(matrix.prepare, 'autocrlf')
        working-directory: .
        run: git config --global core.autocrlf false

      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Prepare the machine
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: ${{ join(matrix.prepare, ' ') }}
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}

      - name: Run and record the unit
        env:
          WHARF_UNIT: ${{ matrix.action }}
          WHARF_TARGET: ${{ matrix.target }}
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship step

  layer-3:
    needs: [plan, layer-1, layer-2]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.layer-3 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.layer-3) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: Keep checkouts byte-identical
        if: contains(matrix.prepare, 'autocrlf')
        working-directory: .
        run: git config --global core.autocrlf false

      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Prepare the machine
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: ${{ join(matrix.prepare, ' ') }}
          node: ${{ needs.plan.outputs.node }}
          pnpm: ${{ needs.plan.outputs.pnpm }}

      - name: Run and record the unit
        env:
          WHARF_UNIT: ${{ matrix.action }}
          WHARF_TARGET: ${{ matrix.target }}
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship step

  npm:
    needs: [plan, layer-1]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.npm == 'run' && (needs.layer-1.result == 'success' || needs.layer-1.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Prepare the declared Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ needs.plan.outputs.node }}

      - name: Prepare the declared pnpm
        env:
          PNPM: ${{ needs.plan.outputs.pnpm }}
        run: npm install --global "pnpm@$PNPM"

      - name: Publish npm packages
        env:
          WHARF_SOURCE: ../product
          WHARF_MARKER: ${{ inputs.marker }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B -m scripts.ship npm-publish

  oci:
    needs: [plan, layer-1, layer-2, layer-3]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.oci == 'run' && (needs.layer-1.result == 'success' || needs.layer-1.result == 'skipped') && (needs.layer-2.result == 'success' || needs.layer-2.result == 'skipped') && (needs.layer-3.result == 'success' || needs.layer-3.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Sign in to the package registry
        working-directory: .
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: Publish the image of the bound binary
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship oci-publish

  chart:
    needs: [plan, layer-1]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.chart == 'run' && (needs.layer-1.result == 'success' || needs.layer-1.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Sign in to the package registry
        working-directory: .
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: Publish charts
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.ship chart-publish

  validate:
    needs: [plan, layer-1, layer-2]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.release == 'run' && (needs.layer-1.result == 'success' || needs.layer-1.result == 'skipped') && (needs.layer-2.result == 'success' || needs.layer-2.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Load the rules the release carries with its own binary
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship validate

  release:
    needs: [plan, layer-1, layer-2, layer-3, validate]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.release == 'run' && (needs.layer-1.result == 'success' || needs.layer-1.result == 'skipped') && (needs.layer-2.result == 'success' || needs.layer-2.result == 'skipped') && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && (needs.layer-3.result == 'success' || needs.layer-3.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Publish the bound binaries and their manager scripts
        env:
          WHARF_SOURCE: ../product
          WHARF_RELEASES_ACCESS_KEY_ID: ${{ secrets.WHARF_RELEASES_ACCESS_KEY_ID }}
          WHARF_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.WHARF_RELEASES_SECRET_ACCESS_KEY }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship release

  cfworker:
    needs: [plan, layer-1]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.cfworker == 'run' && (needs.layer-1.result == 'success' || needs.layer-1.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Prepare the declared Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ needs.plan.outputs.node }}

      - name: Prepare the declared pnpm
        env:
          PNPM: ${{ needs.plan.outputs.pnpm }}
        run: npm install --global "pnpm@$PNPM"

      - name: Deploy and record the workers
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WHARF_CLOUDFLARE_TOKEN }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship cfworker-deploy

  cargo:
    needs: [plan, layer-1]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.cargo == 'run' && (needs.layer-1.result == 'success' || needs.layer-1.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Publish cargo packages
        env:
          WHARF_SOURCE: ../product
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_CARGO_TOKEN: ${{ secrets.WHARF_CARGO_TOKEN }}
        run: python3 -B -m scripts.ship cargo-publish

  complete:
    needs: [plan, layer-1, layer-2, layer-3, npm, oci, chart, validate, release, cfworker, cargo]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Write the trigger record
        env:
          WHARF_NEEDS: ${{ toJSON(needs) }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_ACTOR: ${{ github.triggering_actor }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_PLANNED: ${{ needs.plan.outputs.planned }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.store trigger
