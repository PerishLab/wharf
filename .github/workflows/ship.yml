name: ship

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Product repository, owner/name
        required: true
        type: string
      marker:
        description: Release marker tag in the product repository
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ship-${{ inputs.repository }}-${{ inputs.marker }}
  cancel-in-progress: false

env:
  WHARF_R2_ENDPOINT: ${{ vars.WHARF_R2_ENDPOINT }}
  WHARF_R2_BUCKET: ${{ vars.WHARF_R2_BUCKET }}

defaults:
  run:
    working-directory: wharf

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      binary: ${{ steps.plan.outputs.binary }}
      bind: ${{ steps.plan.outputs.bind }}
      smoke: ${{ steps.plan.outputs.smoke }}
      node: ${{ steps.engines.outputs.node }}
      pnpm: ${{ steps.engines.outputs.pnpm }}
      suite-linux: ${{ steps.plan.outputs.suite-linux }}
      suite-node: ${{ steps.plan.outputs.suite-node }}
      cfworker: ${{ steps.plan.outputs.cfworker }}
      npm: ${{ steps.npm.outputs.decision }}
      oci: ${{ steps.oci.outputs.decision }}
      chart: ${{ steps.chart.outputs.decision }}
      release: ${{ steps.release.outputs.decision }}
      cargo: ${{ steps.cargo.outputs.decision }}
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Refuse a malformed request
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.plan check

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Identify source
        id: source
        env:
          WHARF_SOURCE: ../product
        run: python3 -B -m scripts.plan source

      - name: Sign in to the package registry
        working-directory: .
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: engines
        id: engines
        env:
          WHARF_SOURCE: ../product
        run: python3 -B -m scripts.ship node-engines

      - name: npm packages
        id: npm
        env:
          WHARF_SOURCE: ../product
          WHARF_MARKER: ${{ inputs.marker }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B -m scripts.ship npm-plan

      - name: oci image
        id: oci
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.ship oci-plan

      - name: charts
        id: chart
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.ship chart-plan

      - name: binary release
        id: release
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_COMMIT: ${{ steps.source.outputs.commit }}
          WHARF_WHARF: ${{ github.sha }}
        run: python3 -B -m scripts.ship release-plan

      - name: cargo packages
        id: cargo
        env:
          WHARF_SOURCE: ../product
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_CARGO_TOKEN: ${{ secrets.WHARF_CARGO_TOKEN }}
        run: python3 -B -m scripts.ship cargo-plan

      - name: Record the plan this run decided
        id: plan
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_COMMIT: ${{ steps.source.outputs.commit }}
          WHARF_TREE: ${{ steps.source.outputs.tree }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_STEPS: ${{ toJSON(steps) }}
          WHARF_R2_ENDPOINT: ${{ vars.WHARF_R2_ENDPOINT }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.plan record

  binary:
    needs: plan
    if: needs.plan.outputs.binary != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.binary) }}
    name: binary ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: Keep checkouts byte-identical
        if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.autocrlf false

      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Build and record the binary
        env:
          WHARF_SOURCE: ../product
          WHARF_TARGET: ${{ matrix.target }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship binary

  bind:
    needs: [plan, binary]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.bind == 'run' && (needs.binary.result == 'success' || needs.binary.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Prepare the pinned Mach-O signer
        working-directory: .
        run: |
          curl -fsSLO https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz" | sha256sum -c -
          tar xzf apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          sudo install -m 0755 apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign /usr/local/bin/rcodesign

      - name: Bind and record the release identity
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship bind

  smoke:
    needs: [plan, bind]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.smoke != '[]' && (needs.bind.result == 'success' || needs.bind.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.smoke) }}
    name: smoke ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: Keep checkouts byte-identical
        if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.autocrlf false

      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Smoke and record the bound binary
        env:
          WHARF_TARGET: ${{ matrix.target }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship smoke

  suite-linux:
    needs: plan
    if: needs.plan.outputs.suite-linux == 'run'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Test and record the workspace
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship suite

  suite-node:
    needs: plan
    if: needs.plan.outputs.suite-node == 'run'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Prepare the declared Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ needs.plan.outputs.node }}

      - name: Prepare the declared pnpm
        env:
          PNPM: ${{ needs.plan.outputs.pnpm }}
        run: npm install --global "pnpm@$PNPM"

      - name: Test and record the pnpm workspace
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship node-suite

  npm:
    needs: [plan, suite-linux, suite-node]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.npm == 'run' && (needs.suite-linux.result == 'success' || needs.suite-linux.result == 'skipped') && (needs.suite-node.result == 'success' || needs.suite-node.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Prepare the declared Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ needs.plan.outputs.node }}

      - name: Prepare the declared pnpm
        env:
          PNPM: ${{ needs.plan.outputs.pnpm }}
        run: npm install --global "pnpm@$PNPM"

      - name: Publish npm packages
        env:
          WHARF_SOURCE: ../product
          WHARF_MARKER: ${{ inputs.marker }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B -m scripts.ship npm-publish

  oci:
    needs: [plan, binary, bind, smoke, suite-linux, suite-node]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.oci == 'run' && (needs.binary.result == 'success' || needs.binary.result == 'skipped') && (needs.bind.result == 'success' || needs.bind.result == 'skipped') && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') && (needs.suite-linux.result == 'success' || needs.suite-linux.result == 'skipped') && (needs.suite-node.result == 'success' || needs.suite-node.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Sign in to the package registry
        working-directory: .
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: Publish the image of the bound binary
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship oci-publish

  chart:
    needs: [plan, suite-linux, suite-node]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.chart == 'run' && (needs.suite-linux.result == 'success' || needs.suite-linux.result == 'skipped') && (needs.suite-node.result == 'success' || needs.suite-node.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Sign in to the package registry
        working-directory: .
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: Publish charts
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.ship chart-publish

  validate:
    needs: [plan, binary, bind]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.release == 'run' && (needs.binary.result == 'success' || needs.binary.result == 'skipped') && (needs.bind.result == 'success' || needs.bind.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Load the rules the release carries with its own binary
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship validate

  release:
    needs: [plan, binary, bind, smoke, suite-linux, suite-node, validate]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.release == 'run' && (needs.binary.result == 'success' || needs.binary.result == 'skipped') && (needs.bind.result == 'success' || needs.bind.result == 'skipped') && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') && (needs.suite-linux.result == 'success' || needs.suite-linux.result == 'skipped') && (needs.suite-node.result == 'success' || needs.suite-node.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Publish the bound binaries and their manager scripts
        env:
          WHARF_SOURCE: ../product
          WHARF_RELEASES_ACCESS_KEY_ID: ${{ secrets.WHARF_RELEASES_ACCESS_KEY_ID }}
          WHARF_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.WHARF_RELEASES_SECRET_ACCESS_KEY }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship release

  cfworker:
    needs: [plan, suite-linux, suite-node]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.cfworker == 'run' && (needs.suite-linux.result == 'success' || needs.suite-linux.result == 'skipped') && (needs.suite-node.result == 'success' || needs.suite-node.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Prepare the declared Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ needs.plan.outputs.node }}

      - name: Prepare the declared pnpm
        env:
          PNPM: ${{ needs.plan.outputs.pnpm }}
        run: npm install --global "pnpm@$PNPM"

      - name: Deploy and record the workers
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WHARF_CLOUDFLARE_TOKEN }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.ship cfworker-deploy

  cargo:
    needs: [plan, binary, suite-linux, suite-node]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.cargo == 'run' && (needs.binary.result == 'success' || needs.binary.result == 'skipped') && (needs.suite-linux.result == 'success' || needs.suite-linux.result == 'skipped') && (needs.suite-node.result == 'success' || needs.suite-node.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Publish cargo packages
        env:
          WHARF_SOURCE: ../product
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_CARGO_TOKEN: ${{ secrets.WHARF_CARGO_TOKEN }}
        run: python3 -B -m scripts.ship cargo-publish

  complete:
    needs: [plan, binary, bind, smoke, suite-linux, suite-node, npm, oci, chart, validate, release, cfworker, cargo]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Write the trigger record
        env:
          WHARF_NEEDS: ${{ toJSON(needs) }}
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_ACTOR: ${{ github.triggering_actor }}
          WHARF_WHARF: ${{ github.sha }}
          WHARF_RUN: ${{ github.run_id }}
          WHARF_ATTEMPT: ${{ github.run_attempt }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.store trigger
