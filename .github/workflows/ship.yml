          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
          BOUND: ${{ needs.plan.outputs.bind-linux-key }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          python3 -B -m scripts.store fetch --key "$BOUND" --dir ../bound
          python3 -B -m scripts.ship validate --dir ../bound --name "${REPOSITORY#*/}" --target x86_64-unknown-linux-gnu --repository "$REPOSITORY" --marker "$MARKER"

  release:
    needs: [plan, smoke-linux, smoke-windows, smoke-macos, suite-linux, suite-node, depot, validate]
    if: always() && needs.plan.outputs.release == 'run' && needs.depot.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && (needs.smoke-linux.result == 'success' || needs.smoke-linux.result == 'skipped') && (needs.smoke-windows.result == 'success' || needs.smoke-windows.result == 'skipped') && (needs.smoke-macos.result == 'success' || needs.smoke-macos.result == 'skipped') && (needs.suite-linux.result == 'success' || needs.suite-linux.result == 'skipped') && (needs.suite-node.result == 'success' || needs.suite-node.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Publish the bound binaries and their manager scripts
        env:
          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          WHARF: ${{ github.sha }}
          LINUX: ${{ needs.plan.outputs.bind-linux-key }}
          WINDOWS: ${{ needs.plan.outputs.bind-windows-key }}
          MACOS: ${{ needs.plan.outputs.bind-macos-key }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
          WHARF_RELEASES_ACCESS_KEY_ID: ${{ secrets.WHARF_RELEASES_ACCESS_KEY_ID }}
          WHARF_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.WHARF_RELEASES_SECRET_ACCESS_KEY }}
        run: |
          python3 -B -m scripts.store fetch --key "$LINUX" --dir ../linux
          python3 -B -m scripts.store fetch --key "$WINDOWS" --dir ../windows
          python3 -B -m scripts.store fetch --key "$MACOS" --dir ../macos
          python3 -B -m scripts.ship release-managers --repository "$REPOSITORY" --marker "$MARKER" --commit "$COMMIT" --wharf "$WHARF" --dir ../linux --name "${REPOSITORY#*/}" --source ../product --output ../managers
          python3 -B -m scripts.ship release-publish --repository "$REPOSITORY" --marker "$MARKER" --commit "$COMMIT" --wharf "$WHARF" --linux ../linux --windows ../windows --macos ../macos --managers ../managers

  cfworker:
    needs: [plan, suite-linux, suite-node]
    if: always() && needs.plan.outputs.cfworker == 'run' && (needs.suite-linux.result == 'success' || needs.suite-linux.result == 'skipped') && (needs.suite-node.result == 'success' || needs.suite-node.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Prepare the declared Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ needs.plan.outputs.node }}

      - name: Prepare the declared pnpm
        env:
          PNPM: ${{ needs.plan.outputs.pnpm }}
        run: npm install --global "pnpm@$PNPM"

      - name: Deploy and record the workers
        env:
          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
          KEY: ${{ needs.plan.outputs.cfworker-key }}
          WHARF: ${{ github.sha }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WHARF_CLOUDFLARE_TOKEN }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          key=$(python3 -B -m scripts.ship key-cfworker --source ../product --runner ubuntu-24.04 --basis ../basis.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          [ "$key" = "$KEY" ] || { echo "resolved key $key differs from planned $KEY"; exit 2; }
          python3 -B -m scripts.ship cfworker-deploy --source ../product --output ../deployed
          python3 -c 'import json,os; json.dump({f: os.environ[e] for f, e in {"repository": "REPOSITORY", "marker": "MARKER", "wharf": "WHARF", "run": "RUN", "attempt": "ATTEMPT"}.items()}, open("../context.json", "w"))'
          python3 -B -m scripts.store publish --key "$KEY" --dir ../deployed --basis ../basis.json --context ../context.json

  cargo:
    needs: [plan, binary-linux, suite-linux, suite-node]
    if: always() && needs.plan.outputs.cargo == 'run' && (needs.binary-linux.result == 'success' || needs.binary-linux.result == 'skipped') && (needs.suite-linux.result == 'success' || needs.suite-linux.result == 'skipped') && (needs.suite-node.result == 'success' || needs.suite-node.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Publish cargo packages
        env:
          MARKER: ${{ inputs.marker }}
          WHARF_CARGO_TOKEN: ${{ secrets.WHARF_CARGO_TOKEN }}
        run: python3 -B -m scripts.ship cargo-publish --source ../product --marker "$MARKER"

  complete:
    needs: [plan, binary-linux, bind-linux, smoke-linux, binary-windows, bind-windows, smoke-windows, binary-macos, bind-macos, smoke-macos, suite-linux, suite-node, npm, oci, chart, depot, validate, release, cfworker, cargo]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Write the trigger record
        env:
          NEEDS: ${{ toJSON(needs) }}
          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          TREE: ${{ needs.plan.outputs.tree }}
          ACTOR: ${{ github.triggering_actor }}
          WHARF: ${{ github.sha }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          printf '%s' "$NEEDS" > ../needs.json
          python3 -c 'import json,os; json.dump({f: os.environ[e] for f, e in {"repository": "REPOSITORY", "marker": "MARKER", "commit": "COMMIT", "tree": "TREE", "wharf": "WHARF", "run": "RUN", "attempt": "ATTEMPT", "actor": "ACTOR"}.items()}, open("../context.json", "w"))'
          python3 -B -m scripts.store trigger --context ../context.json --needs ../needs.json
