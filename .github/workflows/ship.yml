name: ship

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Product repository, owner/name
        required: true
        type: string
      marker:
        description: Release marker tag in the product repository
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ship-${{ inputs.repository }}-${{ inputs.marker }}
  cancel-in-progress: false

env:
  WHARF_R2_ENDPOINT: ${{ vars.WHARF_R2_ENDPOINT }}
  WHARF_R2_BUCKET: ${{ vars.WHARF_R2_BUCKET }}

defaults:
  run:
    working-directory: wharf

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      node: ${{ steps.engines.outputs.node }}
      pnpm: ${{ steps.engines.outputs.pnpm }}
      suite-node-key: ${{ steps.suite-node.outputs.key }}
      suite-node: ${{ steps.suite-node.outputs.decision }}
      npm: ${{ steps.npm.outputs.decision }}
      oci: ${{ steps.oci.outputs.decision }}
      chart: ${{ steps.chart.outputs.decision }}
      release: ${{ steps.release.outputs.decision }}
      cfworker-key: ${{ steps.cfworker.outputs.key }}
      cfworker: ${{ steps.cfworker.outputs.decision }}
      commit: ${{ steps.source.outputs.commit }}
      tree: ${{ steps.source.outputs.tree }}
      binary-linux-key: ${{ steps.binary-linux.outputs.key }}
      binary-linux: ${{ steps.binary-linux.outputs.decision }}
      bind-linux-key: ${{ steps.bind-linux.outputs.key }}
      bind-linux: ${{ steps.bind-linux.outputs.decision }}
      smoke-linux-key: ${{ steps.smoke-linux.outputs.key }}
      smoke-linux: ${{ steps.smoke-linux.outputs.decision }}
      binary-windows-key: ${{ steps.binary-windows.outputs.key }}
      binary-windows: ${{ steps.binary-windows.outputs.decision }}
      bind-windows-key: ${{ steps.bind-windows.outputs.key }}
      bind-windows: ${{ steps.bind-windows.outputs.decision }}
      smoke-windows-key: ${{ steps.smoke-windows.outputs.key }}
      smoke-windows: ${{ steps.smoke-windows.outputs.decision }}
      binary-macos-key: ${{ steps.binary-macos.outputs.key }}
      binary-macos: ${{ steps.binary-macos.outputs.decision }}
      bind-macos-key: ${{ steps.bind-macos.outputs.key }}
      bind-macos: ${{ steps.bind-macos.outputs.decision }}
      smoke-macos-key: ${{ steps.smoke-macos.outputs.key }}
      smoke-macos: ${{ steps.smoke-macos.outputs.decision }}
      suite-linux-key: ${{ steps.suite-linux.outputs.key }}
      suite-linux: ${{ steps.suite-linux.outputs.decision }}
      cargo: ${{ steps.cargo.outputs.decision }}
    steps:
      - name: Refuse malformed request
        working-directory: .
        env:
          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
        run: |
          echo "$REPOSITORY" | grep -Eq '^PerishLab/[A-Za-z0-9._-]+$' || { echo "repository $REPOSITORY is not a PerishLab repository"; exit 2; }
          echo "$MARKER" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$' || { echo "marker $MARKER is malformed"; exit 2; }

      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Identify source
        id: source
        run: |
          echo "commit=$(git -C ../product rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git -C ../product rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: binary x86_64-unknown-linux-gnu
        id: binary-linux
        env:
          REPOSITORY: ${{ inputs.repository }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          key=$(python3 -B -m scripts.ship key-binary --source ../product --name "${REPOSITORY#*/}" --target x86_64-unknown-linux-gnu --runner ubuntu-24.04 --basis ../binary-basis.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          reusable=$(python3 -B -m scripts.store reusable --key "$key" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reusable"])')
          decision=run
          [ "$reusable" = True ] && decision=skip
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| binary x86_64-unknown-linux-gnu | \`$key\` | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: identity x86_64-unknown-linux-gnu
        id: bind-linux
        env:
          BINARY: ${{ steps.binary-linux.outputs.key }}
          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
          COMMIT: ${{ steps.source.outputs.commit }}
          TREE: ${{ steps.source.outputs.tree }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          key=$(python3 -B -m scripts.ship key-bind --binary-key "$BINARY" --repository "$REPOSITORY" --marker "$MARKER" --commit "$COMMIT" --tree "$TREE" --basis ../bind-basis.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          reusable=$(python3 -B -m scripts.store reusable --key "$key" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reusable"])')
          decision=run
          [ "$reusable" = True ] && decision=skip
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| identity x86_64-unknown-linux-gnu | \`$key\` | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: smoke x86_64-unknown-linux-gnu
        id: smoke-linux
        env:
          BOUND: ${{ steps.bind-linux.outputs.key }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          key=$(python3 -B -m scripts.ship key-smoke --binary-key "$BOUND" --basis ../smoke-basis.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          reusable=$(python3 -B -m scripts.store reusable --key "$key" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reusable"])')
          decision=run
          [ "$reusable" = True ] && decision=skip
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| smoke x86_64-unknown-linux-gnu | \`$key\` | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: binary x86_64-pc-windows-msvc
        id: binary-windows
        env:
          REPOSITORY: ${{ inputs.repository }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          key=$(python3 -B -m scripts.ship key-binary --source ../product --name "${REPOSITORY#*/}" --target x86_64-pc-windows-msvc --runner windows-2025 --basis ../binary-windows-basis.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          reusable=$(python3 -B -m scripts.store reusable --key "$key" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reusable"])')
          decision=run
          [ "$reusable" = True ] && decision=skip
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| binary x86_64-pc-windows-msvc | \`$key\` | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: identity x86_64-pc-windows-msvc
        id: bind-windows
        env:
          BINARY: ${{ steps.binary-windows.outputs.key }}
          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
          COMMIT: ${{ steps.source.outputs.commit }}
          TREE: ${{ steps.source.outputs.tree }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          key=$(python3 -B -m scripts.ship key-bind --binary-key "$BINARY" --repository "$REPOSITORY" --marker "$MARKER" --commit "$COMMIT" --tree "$TREE" --basis ../bind-windows-basis.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          reusable=$(python3 -B -m scripts.store reusable --key "$key" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reusable"])')
          decision=run
          [ "$reusable" = True ] && decision=skip
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| identity x86_64-pc-windows-msvc | \`$key\` | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: smoke x86_64-pc-windows-msvc
        id: smoke-windows
        env:
          BOUND: ${{ steps.bind-windows.outputs.key }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          key=$(python3 -B -m scripts.ship key-smoke --binary-key "$BOUND" --basis ../smoke-windows-basis.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          reusable=$(python3 -B -m scripts.store reusable --key "$key" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reusable"])')
          decision=run
          [ "$reusable" = True ] && decision=skip
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| smoke x86_64-pc-windows-msvc | \`$key\` | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: binary aarch64-apple-darwin
        id: binary-macos
        env:
          REPOSITORY: ${{ inputs.repository }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          key=$(python3 -B -m scripts.ship key-binary --source ../product --name "${REPOSITORY#*/}" --target aarch64-apple-darwin --runner macos-15 --basis ../binary-macos-basis.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          reusable=$(python3 -B -m scripts.store reusable --key "$key" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reusable"])')
          decision=run
          [ "$reusable" = True ] && decision=skip
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| binary aarch64-apple-darwin | \`$key\` | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: identity aarch64-apple-darwin
        id: bind-macos
        env:
          BINARY: ${{ steps.binary-macos.outputs.key }}
          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
          COMMIT: ${{ steps.source.outputs.commit }}
          TREE: ${{ steps.source.outputs.tree }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          key=$(python3 -B -m scripts.ship key-bind --binary-key "$BINARY" --repository "$REPOSITORY" --marker "$MARKER" --commit "$COMMIT" --tree "$TREE" --basis ../bind-macos-basis.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          reusable=$(python3 -B -m scripts.store reusable --key "$key" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reusable"])')
          decision=run
          [ "$reusable" = True ] && decision=skip
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| identity aarch64-apple-darwin | \`$key\` | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: smoke aarch64-apple-darwin
        id: smoke-macos
        env:
          BOUND: ${{ steps.bind-macos.outputs.key }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          key=$(python3 -B -m scripts.ship key-smoke --binary-key "$BOUND" --basis ../smoke-macos-basis.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          reusable=$(python3 -B -m scripts.store reusable --key "$key" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reusable"])')
          decision=run
          [ "$reusable" = True ] && decision=skip
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| smoke aarch64-apple-darwin | \`$key\` | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: suite x86_64-unknown-linux-gnu
        id: suite-linux
        env:
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          key=$(python3 -B -m scripts.ship key-suite --source ../product --runner ubuntu-24.04 --basis ../suite-basis.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          reusable=$(python3 -B -m scripts.store reusable --key "$key" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reusable"])')
          decision=run
          [ "$reusable" = True ] && decision=skip
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| suite x86_64-unknown-linux-gnu | \`$key\` | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign in to the package registry
        working-directory: .
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: engines
        id: engines
        run: |
          python3 -B -m scripts.ship node-engines --source ../product > ../engines.json
          echo "node=$(python3 -c 'import json; print(json.load(open("../engines.json"))["node"])')" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(python3 -c 'import json; print(json.load(open("../engines.json"))["pnpm"])')" >> "$GITHUB_OUTPUT"

      - name: suite node
        id: suite-node
        env:
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          key=$(python3 -B -m scripts.ship key-node --source ../product --runner ubuntu-24.04 --basis ../node-basis.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          reusable=$(python3 -B -m scripts.store reusable --key "$key" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reusable"])')
          decision=run
          [ "$reusable" = True ] && decision=skip
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| suite node | \`$key\` | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: npm packages
        id: npm
        env:
          MARKER: ${{ inputs.marker }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published=$(python3 -B -m scripts.ship npm-plan --source ../product --marker "$MARKER" | python3 -c 'import json,sys; print(json.load(sys.stdin)["published"])')
          decision=run
          [ "$published" = True ] && decision=skip
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| npm packages | $MARKER | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: oci image
        id: oci
        env:
          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
        run: |
          published=$(python3 -B -m scripts.ship oci-plan --repository "$REPOSITORY" --marker "$MARKER" | python3 -c 'import json,sys; print(json.load(sys.stdin)["published"])')
          decision=run
          [ "$published" = True ] && decision=skip
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| oci image | $MARKER | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: charts
        id: chart
        env:
          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
        run: |
          published=$(python3 -B -m scripts.ship chart-plan --source ../product --repository "$REPOSITORY" --marker "$MARKER" | python3 -c 'import json,sys; print(json.load(sys.stdin)["published"])')
          decision=run
          [ "$published" = True ] && decision=skip
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| charts | $MARKER | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: binary release
        id: release
        env:
          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
          COMMIT: ${{ steps.source.outputs.commit }}
          WHARF: ${{ github.sha }}
        run: |
          published=$(python3 -B -m scripts.ship release-plan --repository "$REPOSITORY" --marker "$MARKER" --commit "$COMMIT" --wharf "$WHARF" | python3 -c 'import json,sys; print(json.load(sys.stdin)["published"])')
          decision=run
          [ "$published" = True ] && decision=skip
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| binary release | $MARKER | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: cfworker
        id: cfworker
        env:
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          key=$(python3 -B -m scripts.ship key-cfworker --source ../product --runner ubuntu-24.04 --basis ../cfworker-basis.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          reusable=$(python3 -B -m scripts.store reusable --key "$key" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reusable"])')
          decision=run
          [ "$reusable" = True ] && decision=skip
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| cfworker | \`$key\` | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: cargo packages
        id: cargo
        env:
          MARKER: ${{ inputs.marker }}
        run: |
          published=$(python3 -B -m scripts.ship cargo-plan --source ../product --marker "$MARKER" | python3 -c 'import json,sys; print(json.load(sys.stdin)["published"])')
          decision=run
          [ "$published" = True ] && decision=skip
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "| cargo packages | $MARKER | $decision |" >> "$GITHUB_STEP_SUMMARY"

      - name: Record the plan this run decided
        env:
          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
          COMMIT: ${{ steps.source.outputs.commit }}
          TREE: ${{ steps.source.outputs.tree }}
          WHARF: ${{ github.sha }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          STEPS: ${{ toJSON(steps) }}
          WHARF_R2_ENDPOINT: ${{ vars.WHARF_R2_ENDPOINT }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.plan record --source ../product --name "${REPOSITORY#*/}" --repository "$REPOSITORY" --marker "$MARKER" --commit "$COMMIT" --tree "$TREE" --wharf "$WHARF" --run "$RUN" --attempt "$ATTEMPT" --steps STEPS

  binary-linux:
    needs: plan
    if: needs.plan.outputs.binary-linux == 'run'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          persist-credentials: false

      - name: Build and record the binary
        env:
          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
          KEY: ${{ needs.plan.outputs.binary-linux-key }}
          WHARF: ${{ github.sha }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          key=$(python3 -B -m scripts.ship key-binary --source ../product --name "${REPOSITORY#*/}" --target x86_64-unknown-linux-gnu --runner ubuntu-24.04 --basis ../basis.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          [ "$key" = "$KEY" ] || { echo "resolved key $key differs from planned $KEY"; exit 2; }
          python3 -B -m scripts.ship binary --source ../product --name "${REPOSITORY#*/}" --target x86_64-unknown-linux-gnu --output ../produced
          python3 -c 'import json,os; json.dump({f: os.environ[e] for f, e in {"repository": "REPOSITORY", "marker": "MARKER", "wharf": "WHARF", "run": "RUN", "attempt": "ATTEMPT"}.items()}, open("../context.json", "w"))'
          python3 -B -m scripts.store publish --key "$KEY" --dir ../produced --basis ../basis.json --context ../context.json

  bind-linux:
    needs: [plan, binary-linux]
    if: always() && needs.plan.outputs.bind-linux == 'run' && (needs.binary-linux.result == 'success' || needs.binary-linux.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Bind and record the release identity
        env:
          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          TREE: ${{ needs.plan.outputs.tree }}
          BINARY: ${{ needs.plan.outputs.binary-linux-key }}
          KEY: ${{ needs.plan.outputs.bind-linux-key }}
          WHARF: ${{ github.sha }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          WHARF_R2_ACCESS_KEY_ID: ${{ secrets.WHARF_R2_ACCESS_KEY_ID }}
          WHARF_R2_SECRET_ACCESS_KEY: ${{ secrets.WHARF_R2_SECRET_ACCESS_KEY }}
        run: |
          key=$(python3 -B -m scripts.ship key-bind --binary-key "$BINARY" --repository "$REPOSITORY" --marker "$MARKER" --commit "$COMMIT" --tree "$TREE" --basis ../basis.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          [ "$key" = "$KEY" ] || { echo "resolved key $key differs from planned $KEY"; exit 2; }
          python3 -B -m scripts.store fetch --key "$BINARY" --dir ../binary
          python3 -B -m scripts.ship bind --dir ../binary --name "${REPOSITORY#*/}" --target x86_64-unknown-linux-gnu --repository "$REPOSITORY" --marker "$MARKER" --commit "$COMMIT" --tree "$TREE" --binary-key "$BINARY" --output ../bound
          python3 -c 'import json,os; json.dump({f: os.environ[e] for f, e in {"repository": "REPOSITORY", "marker": "MARKER", "wharf": "WHARF", "run": "RUN", "attempt": "ATTEMPT"}.items()}, open("../context.json", "w"))'
