name: manager
run-name: "[test] manager windows"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/manager.yml
      - resources/manager/**
      - resources/releases.json
      - lib/content/executables.py
      - lib/media/archive.py
      - lib/media/release.py
      - lib/store/directory.py
      - lib/store/mirror.py
      - scripts/manager.py

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    name: "[test] manager windows ${{ matrix.shell }}"
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: "[prepare] autocrlf"
        working-directory: .
        run: git config --global core.autocrlf false

      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[test] manager windows ${{ matrix.shell }}"
        env:
          WHARF_SHELL: ${{ matrix.shell }}
        run: python3 -B -m scripts.manager windows
