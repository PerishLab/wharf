name: manager
run-name: "[test] suite native"

on:
  workflow_dispatch:
    inputs:
      marker:
        description: Exact Plumb marker for native staging regressions
        type: string
        required: false
  pull_request:
    paths:
      - .github/workflows/manager.yml
      - resources/manager/**
      - resources/releases.json
      - lib/content/executables.py
      - lib/content/declaration.py
      - lib/media/archive.py
      - lib/media/release.py
      - lib/store/directory.py
      - lib/store/mirror.py
      - scripts/manager.py
      - resources/manager/suite.json
      - lib/cargo/suite.py
      - lib/process/job.py
      - lib/process/windows.py
      - tests/lib/cargo/test_suite.py

permissions:
  contents: read
  actions: read

jobs:
  suite:
    if: ${{ !inputs.marker }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows
          - runner: macos-15
            platform: macos
    name: "[test] suite cargo ${{ matrix.platform }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: "[prepare] autocrlf"
        if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.autocrlf false

      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[test] suite cargo ${{ matrix.platform }}"
        run: python3 -B -m scripts.manager suite

  windows:
    if: ${{ !inputs.marker }}
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    name: "[test] manager windows ${{ matrix.shell }}"
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: "[prepare] autocrlf"
        working-directory: .
        run: git config --global core.autocrlf false

      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[test] manager windows ${{ matrix.shell }}"
        env:
          WHARF_SHELL: ${{ matrix.shell }}
        run: python3 -B -m scripts.manager windows

  staging:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.marker }}
    name: "[test] suite windows"
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: "[prepare] autocrlf"
        working-directory: .
        run: git config --global core.autocrlf false

      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[prepare] machine controls"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: snapshot

      - name: "[read] engines"
        id: domain
        run: python3 -B -m scripts.manager domain

      - name: "[prepare] machine rust"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: rust
          rust: ${{ steps.domain.outputs.rust }}

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: PerishLab/plumb
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[test] suite windows staging"
        env:
          WHARF_SOURCE: ../product
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_DOMAIN: ${{ steps.domain.outputs.domain }}
        run: python3 -B -m scripts.manager staging

      - name: "[test] suite windows lease"
        env:
          WHARF_SOURCE: ../product
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_DOMAIN: ${{ steps.domain.outputs.domain }}
        run: python3 -B -m scripts.manager lease
