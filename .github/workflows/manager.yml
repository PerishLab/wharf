name: manager
run-name: "[test] suite native"

on:
  workflow_run:
    workflows: [ship]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: Exact completed non-stable ship run to replay
        type: string
        required: false
      trialcase:
        description: Declared suite or one explicit diagnostic case
        type: string
        default: declared
      marker:
        description: Exact Plumb marker for native staging regressions
        type: string
        required: false
  pull_request:
    paths:
      - .github/workflows/manager.yml
      - resources/manager/**
      - resources/releases.json
      - lib/content/executables.py
      - lib/content/declaration.py
      - lib/media/archive.py
      - lib/media/release.py
      - lib/store/directory.py
      - lib/store/mirror.py
      - scripts/manager.py
      - resources/manager/suite.json
      - lib/cargo/suite.py
      - lib/process/job.py
      - lib/process/windows.py
      - tests/lib/cargo/test_suite.py

permissions:
  contents: read
  actions: read

jobs:
  suite:
    if: ${{ github.event_name != 'workflow_run' && !inputs.marker && !inputs.run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows
          - runner: macos-15
            platform: macos
    name: "[test] suite cargo ${{ matrix.platform }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: "[prepare] autocrlf"
        if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.autocrlf false

      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[test] suite cargo ${{ matrix.platform }}"
        run: python3 -B -m scripts.manager suite

  windows:
    if: ${{ github.event_name != 'workflow_run' && !inputs.marker && !inputs.run }}
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    name: "[test] manager windows ${{ matrix.shell }}"
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: "[prepare] autocrlf"
        working-directory: .
        run: git config --global core.autocrlf false

      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[test] manager windows ${{ matrix.shell }}"
        env:
          WHARF_SHELL: ${{ matrix.shell }}
        run: python3 -B -m scripts.manager windows

  staging:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.marker && !inputs.run }}
    name: "[test] suite windows"
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: wharf
    steps:
      - name: "[prepare] autocrlf"
        working-directory: .
        run: git config --global core.autocrlf false

      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[prepare] machine controls"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: snapshot

      - name: "[read] engines"
        id: domain
        run: python3 -B -m scripts.manager domain

      - name: "[prepare] machine rust"
        uses: ./wharf/.github/actions/prepare
        with:
          prepare: rust
          rust: ${{ steps.domain.outputs.rust }}

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: PerishLab/plumb
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}

      - name: "[test] suite windows staging"
        env:
          WHARF_SOURCE: ../product
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_DOMAIN: ${{ steps.domain.outputs.domain }}
        run: python3 -B -m scripts.manager staging

      - name: "[test] suite windows lease"
        env:
          WHARF_SOURCE: ../product
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_DOMAIN: ${{ steps.domain.outputs.domain }}
        run: python3 -B -m scripts.manager lease

  observe:
    if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.run != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wharf
    steps:
      - name: "[checkout] trusted wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: wharf
          persist-credentials: false

      - name: "[trial] admit publisher"
        id: admit
        env:
          WHARF_SOURCE: ${{ runner.temp }}/seatrial-observation
          GH_TOKEN: ${{ github.token }}
          WHARF_RUN: ${{ inputs.run || github.event.workflow_run.id }}
        run: python3 -B -m scripts.distribution trial-admit

      - name: "[trial] published artifacts"
        if: steps.admit.outputs.eligible == 'true'
        env:
          WHARF_SOURCE: ${{ runner.temp }}/seatrial-observation
          WHARF_TRIALCASE: ${{ inputs.trialcase || 'declared' }}
        run: python3 -B -m scripts.distribution trial-run

      - name: "[trial] judge observation"
        if: always() && steps.admit.outputs.eligible == 'true'
        env:
          WHARF_SOURCE: ${{ runner.temp }}/seatrial-observation
        run: python3 -B -m scripts.distribution trial-judge

      - name: "[trial] preserve evidence"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: seatrial-observation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seatrial-observation/evidence
          if-no-files-found: error
          retention-days: 14
