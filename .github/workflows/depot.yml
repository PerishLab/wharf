name: lodge
run-name: "[lodge] ${{ inputs.repository }} ${{ inputs.marker }} ${{ inputs.kind }}"

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Product repository, owner/name
        required: true
        type: string
      marker:
        description: Release marker tag in the product repository
        required: true
        type: string
      kind:
        description: Depot kind the consignment carries
        required: true
        type: choice
        options:
          - changelog
          - skill
      digest:
        description: sha256 of the consignment in the yard
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: depot-${{ inputs.repository }}-${{ inputs.kind }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: wharf

jobs:
  lodge:
    name: "[lodge] ${{ inputs.kind }}"
    runs-on: ubuntu-24.04
    steps:
      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[verify] request"
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.plan check

      - name: "[checkout] product"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: "[prepare] plumb"
        working-directory: .
        run: |
          curl -fsSLO https://releases.plumb.perish.uk/v1/objects/sha256/7605f9611a471e38b79cdc7704b9af4f5c04be013352ded585fa50e39e0c53e8/plumb-x86_64-unknown-linux-gnu.tar.gz
          echo "7605f9611a471e38b79cdc7704b9af4f5c04be013352ded585fa50e39e0c53e8  plumb-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar xzf plumb-x86_64-unknown-linux-gnu.tar.gz
          sudo install -m 0755 plumb /usr/local/bin/plumb

      - name: "[lodge] ${{ inputs.kind }}"
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_KIND: ${{ inputs.kind }}
          WHARF_DIGEST: ${{ inputs.digest }}
          WHARF_R2_ENDPOINT: ${{ vars.WHARF_R2_ENDPOINT }}
          WHARF_DEPOT_ACCESS_KEY_ID: ${{ secrets.WHARF_DEPOT_ACCESS_KEY_ID }}
          WHARF_DEPOT_SECRET_ACCESS_KEY: ${{ secrets.WHARF_DEPOT_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.depot lodge
