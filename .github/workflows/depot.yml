name: lodge
run-name: "[lodge] ${{ inputs.repository }} ${{ inputs.marker }} ${{ inputs.kind }}"

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Product repository, owner/name
        required: true
        type: string
      marker:
        description: Release marker tag in the product repository
        required: true
        type: string
      kind:
        description: Depot kind the consignment carries
        required: true
        type: choice
        options:
          - changelog
          - skill
      digest:
        description: sha256 of the consignment in the yard
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: depot-${{ inputs.repository }}-${{ inputs.kind }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: wharf

jobs:
  lodge:
    name: "[lodge] ${{ inputs.kind }}"
    runs-on: ubuntu-24.04
    steps:
      - name: "[checkout] wharf"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: "[verify] request"
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.plan check

      - name: "[checkout] product"
        uses: ./wharf/.github/actions/product
        with:
          repository: ${{ inputs.repository }}
          marker: ${{ inputs.marker }}
          client-id: ${{ vars.WHARF_APP_CLIENT_ID }}
          private-key: ${{ secrets.WHARF_APP_PRIVATE_KEY }}
          fetch-depth: 0

      - name: "[prepare] plumb"
        working-directory: .
        run: |
          curl -fsSL https://releases.plumb.perish.uk/manage.sh -o "$RUNNER_TEMP/manage-plumb.sh"
          env PLUMB_CHANNEL=stable PLUMB_VERSION= sh "$RUNNER_TEMP/manage-plumb.sh" install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "[lodge] ${{ inputs.kind }}"
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_KIND: ${{ inputs.kind }}
          WHARF_DIGEST: ${{ inputs.digest }}
          WHARF_R2_ENDPOINT: ${{ vars.WHARF_R2_ENDPOINT }}
          WHARF_DEPOT_ACCESS_KEY_ID: ${{ secrets.WHARF_DEPOT_ACCESS_KEY_ID }}
          WHARF_DEPOT_SECRET_ACCESS_KEY: ${{ secrets.WHARF_DEPOT_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.depot lodge
