name: depot

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Product repository, owner/name
        required: true
        type: string
      marker:
        description: Release marker tag in the product repository
        required: true
        type: string
      kind:
        description: Depot kind to inherit
        required: true
        default: configuration
        type: choice
        options:
          - configuration
          - skill

permissions:
  contents: read

concurrency:
  group: depot-${{ inputs.repository }}-${{ inputs.kind }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: wharf

jobs:
  inherit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Refuse a malformed request
        env:
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
        run: python3 -B -m scripts.plan check

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Inherit the generation
        env:
          WHARF_SOURCE: ../product
          WHARF_REPOSITORY: ${{ inputs.repository }}
          WHARF_MARKER: ${{ inputs.marker }}
          WHARF_KIND: ${{ inputs.kind }}
          WHARF_R2_ENDPOINT: ${{ vars.WHARF_R2_ENDPOINT }}
          WHARF_DEPOT_ACCESS_KEY_ID: ${{ secrets.WHARF_DEPOT_ACCESS_KEY_ID }}
          WHARF_DEPOT_SECRET_ACCESS_KEY: ${{ secrets.WHARF_DEPOT_SECRET_ACCESS_KEY }}
        run: python3 -B -m scripts.depot patch
