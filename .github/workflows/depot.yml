name: depot

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Product repository, owner/name
        required: true
        type: string
      marker:
        description: Release marker tag in the product repository
        required: true
        type: string
      kind:
        description: Depot kind to inherit
        required: true
        default: configuration
        type: choice
        options:
          - configuration
          - skill
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      marker:
        required: true
        type: string
      kind:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: depot-${{ inputs.repository }}-${{ inputs.kind }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: wharf

jobs:
  inherit:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse malformed request
        working-directory: .
        env:
          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
        run: |
          echo "$REPOSITORY" | grep -Eq '^PerishLab/[A-Za-z0-9._-]+$' || { echo "repository $REPOSITORY is not a PerishLab repository"; exit 2; }
          echo "$MARKER" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$' || { echo "marker $MARKER is not a release marker"; exit 2; }

      - name: Check out wharf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: wharf
          persist-credentials: false

      - name: Check out product at marker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository }}
          ref: refs/tags/${{ inputs.marker }}
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Inherit the generation
        env:
          REPOSITORY: ${{ inputs.repository }}
          MARKER: ${{ inputs.marker }}
          KIND: ${{ inputs.kind }}
          WHARF_R2_ENDPOINT: ${{ vars.WHARF_R2_ENDPOINT }}
          WHARF_DEPOT_ACCESS_KEY_ID: ${{ secrets.WHARF_DEPOT_ACCESS_KEY_ID }}
          WHARF_DEPOT_SECRET_ACCESS_KEY: ${{ secrets.WHARF_DEPOT_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          python3 -B -m scripts.depot patch --repository "$REPOSITORY" --marker "$MARKER" --kind "$KIND" --source ../product | tee ../depot.json
          echo "| $KIND | $MARKER | $(python3 -c 'import json; d=json.load(open("../depot.json")); print(d["state"], d["generation"][:12])') |" >> "$GITHUB_STEP_SUMMARY"
